name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Rust ${{ matrix.rust }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: "1.88"
          - os: ubuntu-latest
            rust: stable
          - os: macos-latest
            rust: stable
          - os: windows-latest
            rust: stable

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --check
      - name: Check all targets
        run: cargo check --locked --all-targets --all-features
      - name: Lint all targets
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test locked dependencies
        run: cargo test --locked
      - name: Test optimized build
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: cargo test --locked --release
      - name: Run the documented FEN example
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: >-
          cargo run --locked --example certify_fen --
          '7k/8/8/p1p1p1p1/PpPpPpPp/1P1P1P1P/8/K7 w - - 0 1'
      - name: Reject missing public documentation
        run: cargo rustdoc --all-features --lib -- -D warnings -D missing-docs
      - name: Verify package assembly
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: cargo package --locked
      - name: Test extracted packaged source
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: cargo test --locked --manifest-path target/package/bitmesh-0.1.0/Cargo.toml
      - name: Inspect package contents
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: cargo package --locked --list
      - name: Verify registry publication without uploading
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: cargo publish --locked --dry-run
