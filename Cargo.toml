[package]
name = "bitmesh"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Devin Nicholson"]
description = "Conservative structural decomposition certificates for chess bitboards"
license = "GPL-3.0-or-later"
repository = "https://github.com/devinnicholson/bitmesh"
homepage = "https://github.com/devinnicholson/bitmesh"
documentation = "https://docs.rs/bitmesh"
readme = "README.md"
keywords = ["chess", "bitboard", "graph", "cgt", "research"]
categories = ["algorithms", "game-development", "mathematics"]
include = [
    "src/**",
    "examples/**",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "DEVELOPER_CERTIFICATE_OF_ORIGIN",
    "LICENSE",
    "SECURITY.md",
    "SUPPORT.md",
    "CITATION.cff",
    "deny.toml",
    "docs/RELEASE_CHECKLIST.md",
]

[dependencies]
shakmaty = "0.30"
